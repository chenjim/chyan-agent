# ============================================================
# Chyan Agent 配置文件
# ============================================================

# ------------------------------------------------------------
# Prompt 配置
# ------------------------------------------------------------
[prompt]
# Agent 系统提示词，定义 Agent 的行为规则和上下文策略
system = """\
你是一个运行在 10K 上下文窗口下的轻量 Agent。

核心规则：
1. 当需要记住长期事实时，使用 remember 工具。
2. 当需要回忆过往信息时，使用 recall 工具。
3. 文件操作前先用 search 确认路径。
4. 回复简洁，避免冗余。

当前上下文预算有限，请优先使用工具而非依赖对话历史。"""

# ------------------------------------------------------------
# LLM 配置
# ------------------------------------------------------------
[llm]
# API 基础 URL，支持 OpenAI 兼容接口
base_url = "https://api.openai.com/v1"

# API 密钥
api_key = "sk-your-key-here"

# 模型名称，如 mimo-v2.5-pro, deepseek-v4-pro, kimi-k2.7-code, glm-5.2 等
model = "qwen3.7-plus"

# 温度参数，控制输出随机性，范围 0.0-2.0
# 0.0 = 确定性输出，1.0 = 平衡，2.0 = 高随机性
temperature = 0.3

# 单次响应最大 token 数
max_tokens = 1024

# ------------------------------------------------------------
# 上下文管理配置
# ------------------------------------------------------------
[context]
# 上下文窗口总 token 限制
context_limit = 10000

# 为系统提示、工具定义等保留的 token 数
reserved_tokens = 3500

# 保留的最近对话轮次数，用于上下文压缩时保护最近消息
max_recent_turns = 2

# 压缩比例，超出限制时将中间对话压缩为摘要的比例
# 0.3 表示压缩后保留 30% 的原始信息量
summary_ratio = 0.3

# ------------------------------------------------------------
# 记忆系统配置
# ------------------------------------------------------------
[memory]
# 记忆数据存储目录
data_dir = "./data"

# 召回模式：bm25 (基于关键词) 或 semantic (语义相似度)
recall_mode = "bm25"

# 召回时返回的最相关记忆条数
recall_top_k = 5

# ------------------------------------------------------------
# 工具配置
# ------------------------------------------------------------
[tools]
# read_file 工具单次读取的最大行数
read_max_lines = 500

# 文件读取截断模式：
#   auto - 自动选择头部或尾部
#   head - 始终从头部读取
#   tail - 始终从尾部读取
read_truncate_mode = "auto"

# 单轮对话中工具调用的最大迭代次数，防止无限循环
max_tool_iterations = 10

# ------------------------------------------------------------
# 日志配置
# ------------------------------------------------------------
[logging]
# 日志级别：DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"

# 日志文件路径
log_file = "./data/agent.log"

# 单个日志文件最大字节数 (10MB)
max_bytes = 10485760

# 保留的历史日志文件数量
backup_count = 3
